# security/certbot/nginx-certbot.conf
# Production nginx config using Let's Encrypt certificates.
# Replace the self-signed cert config with this for production deployments.
#
# Prerequisites:
#   1. Domain pointed to this server's public IP
#   2. Port 80 open for ACME HTTP-01 challenge
#   3. Run: ./security/certbot/issue_cert.sh yourdomain.com admin@yourdomain.com
#
# After issuing the cert, replace security/nginx/nginx.conf with this file
# and rebuild: make up-security

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/s;

    upstream frontend   { server frontend:3001;    keepalive 16; }
    upstream appbackend { server app-backend:8400; keepalive 32; }
    upstream mlgateway  { server api-gateway:8000; keepalive 32; }

    # HTTP: ACME challenge + redirect
    server {
        listen 80;
        server_name DOMAIN_PLACEHOLDER;

        # Let's Encrypt ACME HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: production server
    server {
        listen 443 ssl http2;
        server_name DOMAIN_PLACEHOLDER;

        # Let's Encrypt certificates (managed by certbot)
        ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"   always;
        add_header X-Content-Type-Options    "nosniff"      always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:;"
            always;

        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass         http://appbackend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 3600s;
            proxy_buffering    off;
        }

        location /api/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://appbackend/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ml/ {
            limit_req zone=api burst=500 nodelay;
            proxy_pass         http://mlgateway/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location / {
            limit_req zone=general burst=500 nodelay;
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
