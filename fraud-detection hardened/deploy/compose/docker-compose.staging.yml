# deploy/compose/docker-compose.staging.yml
# Staging environment overrides.
# Usage: docker compose -f docker-compose.yml -f deploy/compose/docker-compose.staging.yml up -d
#
# Differences from base:
#   - Higher resource limits (closer to production)
#   - Replica counts where supported
#   - Staging-specific env vars
#   - TLS enforced via nginx
#   - No synthetic generator (real transactions from webhook adapter)

version: "3.9"

x-staging-logging: &staging-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ── ML Pipeline — tighter resource limits than production, no generator ──

  generator:
    profiles: []  # Disabled in staging — use real transactions

  api-gateway:
    logging: *staging-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 512M
    environment:
      LOG_LEVEL: INFO
      TIMEOUT_STAGE1: "0.015"
      TIMEOUT_STAGE2: "0.150"

  stage1-service:
    logging: *staging-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 2G

  stage2-service:
    logging: *staging-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          memory: 4G

  app-backend:
    logging: *staging-logging
    environment:
      DEBUG: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: "${CORS_ORIGINS}"    # must be set — no default
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  frontend:
    logging: *staging-logging
    environment:
      NEXT_PUBLIC_API_URL:      "${STAGING_API_URL}"
      BACKEND_INTERNAL_URL:     http://app-backend:8400
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  feedback-service:
    logging: *staging-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  mlops-service:
    logging: *staging-logging
    environment:
      RETRAIN_LABEL_THRESHOLD: "1000"   # Higher threshold in staging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Infrastructure — staging sizing ──

  postgres:
    logging: *staging-logging
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c log_statement=ddl
      -c log_min_duration_statement=1000

  clickhouse:
    logging: *staging-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  redis:
    logging: *staging-logging
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 3600 1

  neo4j:
    logging: *staging-logging
    environment:
      NEO4J_dbms_memory_heap_maxSize: "2G"

  nginx:
    logging: *staging-logging
    # In staging: use real certificates from /etc/letsencrypt
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./security/certbot/nginx-certbot.conf:/etc/nginx/nginx.conf:ro
